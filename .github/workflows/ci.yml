name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Backtraces on a CI failure cost nothing and save a re-run.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  build:
    name: build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native ARM runner rather than cross-compiling: ring and aws-lc-rs
          # both build C, and a native build avoids the whole toolchain dance.
          # Free for public repos; swap to ubuntu-latest plus
          # gcc-aarch64-linux-gnu if this repo is private.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # Two shapes of asset: an archive for people installing by hand, and the
      # raw binaries so `quix update` can swap them without unpacking anything.
      # Everything lands in dist/ — the archive is staged elsewhere because its
      # directory name would otherwise collide with the raw `quix-<name>` asset.
      - name: package (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release
          name=${{ matrix.name }}
          mkdir -p dist

          stage=$(mktemp -d)
          mkdir -p "$stage/quix-$name"
          cp "$bin/quix" "$bin/quixd" "$stage/quix-$name/"
          cp packaging/quixd.service scripts/install.sh "$stage/quix-$name/"
          tar -czf "dist/quix-$name.tar.gz" -C "$stage" "quix-$name"

          cp "$bin/quix" "dist/quix-$name"
          cp "$bin/quixd" "dist/quixd-$name"

          cd dist
          for f in "quix-$name.tar.gz" "quix-$name" "quixd-$name"; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          $name = "${{ matrix.name }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $stage = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid())
          New-Item -ItemType Directory -Path "$stage/quix-$name" -Force | Out-Null
          Copy-Item "$bin/quix.exe","$bin/quixd.exe" "$stage/quix-$name"
          Copy-Item "scripts/install.ps1" "$stage/quix-$name"
          Compress-Archive -Path "$stage/quix-$name" -DestinationPath "dist/quix-$name.zip"

          Copy-Item "$bin/quix.exe" "dist/quix-$name.exe"
          Copy-Item "$bin/quixd.exe" "dist/quixd-$name.exe"

          foreach ($f in "quix-$name.zip", "quix-$name.exe", "quixd-$name.exe") {
            (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower() + "  $f" |
              Out-File -Encoding ascii "dist/$f.sha256"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: quix-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Covers archives, raw binaries and every .sha256, without the two
          # patterns overlapping and offering the same file twice.
          files: |
            quix-*
            quixd-*
          generate_release_notes: true
