[package]
name = "quix-daemon"
version.workspace = true
edition = "2021"

[[bin]]
name = "quixd"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
iroh.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs = "7.0.0"
tun-rs = { version = "2.8.9", features = ["async_tokio"] }
sha2 = "0.11.0"
interprocess = { version = "2.4.4", features = ["tokio"] }
hex = "0.4.3"
serde = { workspace = true, features = ["derive"] }
getrandom = "0.4.3"
bs58 = "0.5.1"
bytes = "1.12.1"
simple-dns = "0.12.0"
# "serde" is what gives invite expiry timestamps their RFC 3339 form in
# network.json. It happens to be switched on elsewhere in the dependency graph,
# but relying on that would make this build break for reasons far from here.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
# Identifying the client on the other end of the control pipe: impersonation,
# token queries and SID formatting.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_Pipes",
	"Win32_System_Threading",
	"Win32_System_SystemServices",
] }

[target."cfg(unix)".dependencies]
uzers = "0.12.2"
